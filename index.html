<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>쌤자리 (SSAM-ZARI) - 강사용 온라인 출석부</title>
    <meta name="description" content="강사 선생님들을 위한 자리 매칭형 모바일 반응형 온라인 출석부">

    <!-- Tailwind CSS V4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- SheetJS (XLSX) for Excel Parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        body { font-family: 'Outfit', system-ui, sans-serif; }
    </style>
</head>
<body class="overflow-hidden selection:bg-indigo-300/40">

    <!-- Main Container -->
    <main id="app-container" class="relative w-full h-screen flex flex-col" style="max-width:960px;margin:0 auto;">

        <!-- Top Header -->
        <header class="app-header safe-top flex items-center justify-between" style="padding:16px 28px;">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div style="width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(99,102,241,0.35);">
                    <span style="font-size:20px;">🏫</span>
                </div>
                <div>
                    <h1 style="font-size:20px;font-weight:900;color:var(--text-primary);letter-spacing:-0.03em;line-height:1;">쌤자리</h1>
                    <p style="font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:0.04em;">SSAM-ZARI</p>
                </div>
            </div>

            <!-- Right: Connection + Theme Toggle -->
            <div class="flex items-center gap-3">
                <div id="connection-status" class="status-disconnected flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold">
                    <span style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;"></span>
                    연결 필요
                </div>
                <!-- Theme Toggle -->
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="라이트/다크 모드 전환" id="theme-btn">
                    ☀️
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <section id="main-content" class="flex-1 overflow-y-auto scrollbar-hide" style="padding:20px 28px 140px 28px;">
            <!-- Screens injected here -->
        </section>

        <!-- Bottom Tab Navigation -->
        <nav class="bottom-nav-wrap fixed bottom-0 left-0 right-0 safe-bottom" style="max-width:960px;margin:0 auto;">
            <div class="flex items-center justify-around" style="padding:12px 28px;">
                <button onclick="switchScreen('attendance')" class="nav-btn active" data-screen="attendance">
                    <i data-lucide="check-square" style="width:24px;height:24px;"></i>
                    <span class="nav-label">출석체크</span>
                </button>
                <button onclick="switchScreen('seating')" class="nav-btn" data-screen="seating">
                    <i data-lucide="grid" style="width:24px;height:24px;"></i>
                    <span class="nav-label">자리배치</span>
                </button>
                <button onclick="switchScreen('management')" class="nav-btn" data-screen="management">
                    <i data-lucide="users" style="width:24px;height:24px;"></i>
                    <span class="nav-label">명단관리</span>
                </button>
                <button onclick="switchScreen('settings')" class="nav-btn" data-screen="settings">
                    <i data-lucide="settings" style="width:24px;height:24px;"></i>
                    <span class="nav-label">설정</span>
                </button>
            </div>
        </nav>

    </main>

    <!-- Global Loading Overlay -->
    <div id="global-loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div style="position:relative;width:56px;height:56px;">
            <div style="position:absolute;inset:0;border:4px solid rgba(99,102,241,0.15);border-radius:50%;"></div>
            <div style="position:absolute;inset:0;border:4px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        </div>
        <p style="margin-top:16px;color:var(--text-muted);font-weight:600;font-size:14px;">불러오는 중...</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-2xl translate-y-[-200%] transition-transform duration-500 flex items-center gap-3" style="min-width:220px;">
        <div id="toast-icon" style="color:var(--accent);"></div>
        <p id="toast-message" style="font-size:14px;font-weight:700;color:var(--text-primary);"></p>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="file-upload-input" class="hidden" accept=".xlsx, .xls, .csv, .txt" onchange="handleFileUpload(event)">

    <!-- Upload Preview Modal -->
    <div id="upload-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="modal-panel w-full max-w-lg flex flex-col" style="max-height:80vh;">
            <div style="padding:24px 24px 20px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
                <h3 style="font-size:18px;font-weight:800;color:var(--text-primary);">📋 업로드 명단 확인</h3>
                <button onclick="closeModal()" style="color:var(--text-muted);background:none;border:none;cursor:pointer;padding:4px;">
                    <i data-lucide="x" style="width:22px;height:22px;"></i>
                </button>
            </div>
            <div id="modal-content" class="flex-1 overflow-y-auto scrollbar-hide" style="padding:24px;"></div>
            <div style="padding:20px 24px;border-top:1.5px solid var(--border);display:flex;gap:12px;">
                <button onclick="closeModal()" style="flex:1;padding:14px;border-radius:14px;background:var(--bg-subtle);color:var(--text-muted);font-weight:700;font-size:15px;border:1.5px solid var(--border);cursor:pointer;font-family:'Outfit',sans-serif;">취소</button>
                <button onclick="confirmBulkUpload()" style="flex:1;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,0.4);font-family:'Outfit',sans-serif;">일괄 저장</button>
            </div>
        </div>
    </div>

    <!-- Multi-Add Modal -->
    <div id="multi-add-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="modal-panel w-full max-w-lg flex flex-col" style="max-height:85vh;">
            <div style="padding:24px 24px 20px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
                <div>
                    <h3 style="font-size:18px;font-weight:800;color:var(--text-primary);">✏️ 명단 일괄 등록</h3>
                    <p style="font-size:12px;color:var(--text-muted);margin-top:4px;font-weight:600;">학교·학년·반 선택 후 명단을 입력하세요</p>
                </div>
                <button onclick="closeMultiAddModal()" style="color:var(--text-muted);background:none;border:none;cursor:pointer;padding:4px;">
                    <i data-lucide="x" style="width:22px;height:22px;"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto scrollbar-hide" style="padding:24px;">
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">학교명</label>
                        <input type="text" id="multi-school" placeholder="○○초" class="form-input" style="padding:12px 14px;font-size:14px;">
                    </div>
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">학년</label>
                        <input type="number" id="multi-grade" placeholder="1" class="form-input" style="padding:12px 14px;font-size:14px;">
                    </div>
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">반</label>
                        <input type="text" id="multi-class" placeholder="1반" class="form-input" style="padding:12px 14px;font-size:14px;">
                    </div>
                </div>
                <textarea id="multi-input-area"
                    placeholder="번호와 이름을 한 줄씩 입력&#10;1 홍길동&#10;2 임꺽정"
                    style="width:100%;height:200px;background:var(--bg-subtle);border:2px solid var(--border);border-radius:16px;padding:16px;font-size:14px;font-weight:600;color:var(--text-primary);font-family:monospace;resize:none;outline:none;transition:border-color 0.2s;"></textarea>
            </div>
            <div style="padding:20px 24px;border-top:1.5px solid var(--border);display:flex;gap:12px;">
                <button onclick="closeMultiAddModal()" style="flex:1;padding:14px;border-radius:14px;background:var(--bg-subtle);color:var(--text-muted);font-weight:700;font-size:15px;border:1.5px solid var(--border);cursor:pointer;font-family:'Outfit',sans-serif;">취소</button>
                <button id="multi-add-btn" onclick="processMultiAdd()" style="flex:1;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,0.4);font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <span id="btn-text">추가하기</span>
                    <div id="btn-loader" class="hidden" style="width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                </button>
            </div>
        </div>
    </div>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Theme Toggle Script -->
    <script>
        const savedTheme = localStorage.getItem('ssam_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('ssam_theme', next);
            document.getElementById('theme-btn').textContent = next === 'dark' ? '🌙' : '☀️';
        }
    </script>

    <script src="app.js"></script>
</body>
</html>
